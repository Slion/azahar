name: azalea

on:
  push:
    branches: [ slions ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      OS: android
      TARGET: azalea
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ env.OS }}-${{ env.TARGET }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ env.OS }}-${{ env.TARGET }}-
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install ccache apksigner -y
      - name: Update Android SDK CMake version
        run: |
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "cmake;3.30.3"
      - name: Build
        run: JAVA_HOME=$JAVA_HOME_17_X64 ./.ci/android.sh
      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp src/android/app/build/outputs/apk/azalea/release/*.apk artifacts/
          cp src/android/app/build/outputs/bundle/azaleaRelease/*.aab artifacts/
      - name: Move rolling tag
        run: git tag -f azalea-head
      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: azalea-head
          name: Azalea head build
          files: |
            artifacts/*.apk
            artifacts/*.aab
          body: |
            Azalea variant head build from the `slions` branch.
            Package: `net.slions.azalea`
            Commit: `${{ github.sha }}`
